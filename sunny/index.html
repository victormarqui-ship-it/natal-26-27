<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sunny Trip mudou de endereço</title>
<link rel="canonical" href="https://sunnytrip.app/app/">
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#000;text-align:center;padding:24px}
  @media (prefers-color-scheme: dark){body{background:#000;color:#f5f5f7}}
  a{color:inherit;font-weight:600}
  p{margin:8px 0;color:#6e6e73}
</style>
</head>
<body>
<main>
  <h1 style="font-size:24px;margin:0 0 8px">O Sunny Trip mudou de endereço</h1>
  <p>Levando suas viagens para <b>sunnytrip.app</b>…</p>
  <p><a id="go" href="https://sunnytrip.app/app/">Abrir o novo endereço</a></p>
</main>
<script>
/* Leva as viagens salvas neste endereço antigo para sunnytrip.app/app (o app novo recebe em #mig=). */
(async function(){
  const NEW = "https://sunnytrip.app/app/";
  const h = location.hash || "";
  if (h.startsWith("#t=")) { location.replace(NEW + h); return; }          // link de roteiro compartilhado
  const b64u = u8 => { let s = ""; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
  async function zip(str){
    const u = new TextEncoder().encode(str);
    if (typeof CompressionStream === "undefined") return "j" + b64u(u);
    const cs = new Blob([u]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return "z" + b64u(new Uint8Array(await new Response(cs).arrayBuffer()));
  }
  let target = NEW;
  try {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && /^sunny/.test(k)) data[k] = localStorage.getItem(k);
    }
    if (Object.keys(data).length) target = NEW + "#mig=" + await zip(JSON.stringify(data));
  } catch (e) {}
  document.getElementById("go").href = target;
  location.replace(target);
})();
</script>
</body>
</html>
