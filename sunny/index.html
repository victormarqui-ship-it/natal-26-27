<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffc800"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="Monte sua viagem para Portugal e Itália: roteiro, mala, custos e divisão de gastos.">
<title>Sunny Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Visual de app de jogo: cores chapadas e vivas, cantos redondos, botões "de apertar" com sombra sólida,
   uma pergunta por tela com barra de progresso, roteiro como um caminho de fases e um mascote (o Sol). */
:root{
  --bg:#ffffff; --ink:#3c3c3c; --sub:#777777; --line:#e5e5e5; --card:#ffffff; --soft:#f7f7f7;
  --sun:#ffc800; --sun-d:#e5a400; --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --blue-d:#1899d6;
  --red:#ff4b4b; --red-d:#ea2b2b; --purple:#ce82ff; --purple-d:#a568cc; --orange:#ff9600; --orange-d:#cd7900;
  --sel:#ddf4ff; --sel-b:#84d8ff; --off:#e5e5e5; --off-d:#cecece;
  --f:"Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131f24; --ink:#f1f7fb; --sub:#a3b1ba; --line:#37464f; --card:#131f24; --soft:#202f36; --sel:#1b3a4b; --sel-b:#3f85a7; --off:#37464f; --off-d:#2a363d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131f24; --ink:#f1f7fb; --sub:#a3b1ba; --line:#37464f; --card:#131f24; --soft:#202f36; --sel:#1b3a4b; --sel-b:#3f85a7; --off:#37464f; --off-d:#2a363d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;font-weight:700;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:600px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:900;letter-spacing:-.01em}
.k{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.mono{font-variant-numeric:tabular-nums}
.sub{color:var(--sub)} .sm{font-size:14.5px} .xs{font-size:12.5px}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .sb{justify-content:space-between}
.glass{background:var(--card);border:2px solid var(--line);border-radius:20px}
.card{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
button{font:inherit;color:inherit} a{color:var(--blue);font-weight:800;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input[type=text],input[type=date],input[type=number],select{font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:var(--blue)}
label.f{display:flex;flex-direction:column;gap:6px;min-width:0}
label.f > span{font-size:13px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .g2 > *{min-width:0}
/* botão de apertar */
.press{--c:var(--blue);--d:var(--blue-d);border:0;border-radius:16px;background:var(--c);color:#fff;font-weight:900;text-transform:uppercase;letter-spacing:.05em;
  box-shadow:0 4px 0 var(--d);cursor:pointer;transition:transform .08s,box-shadow .08s;padding:15px;font-size:16px}
.press:active{transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.press:disabled{--c:var(--off);--d:var(--off-d);color:var(--sub);cursor:not-allowed}
.press.green{--c:var(--green);--d:var(--green-d)} .press.sun{--c:var(--sun);--d:var(--sun-d);color:#4b3800}
.press.ghost{--c:var(--card);--d:var(--line);color:var(--blue);border:2px solid var(--line)}
.link{border:0;background:none;color:var(--blue);font-weight:900;cursor:pointer;padding:6px 0;text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.err{background:#ffdfe0;color:#c62828;border-radius:14px;padding:12px 14px;font-size:15px}
.pillbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.pillbtn:disabled{opacity:.4}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:21px;color:var(--orange)}
.brand svg{width:34px;height:34px}
/* tela inicial */
.start{min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding-top:18px}
.start .mascot{width:190px;height:190px;align-self:center}
.start h1{font-size:clamp(30px,8.5vw,40px);line-height:1.08}
.start p{margin:0;color:var(--sub);font-size:17px}
.tripRow{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer;text-align:left;width:100%;border:0;border-top:2px solid var(--line);background:none;color:inherit}
.tripRow:first-of-type{border-top:0}
.tripRow .th{width:62px;height:46px;border-radius:12px;overflow:hidden;flex:0 0 auto}
.tripRow .th svg{width:100%;height:100%;display:block}
/* assistente, uma pergunta por tela */
.wz{display:flex;flex-direction:column;gap:18px;padding-top:14px;min-height:calc(100vh - 110px)}
.wzTop{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center}
.wzTop button{border:0;background:none;font-size:26px;color:var(--sub);cursor:pointer;line-height:1;padding:0}
.prog{height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--green);position:relative;transition:width .35s cubic-bezier(.3,1.3,.5,1)}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.say{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center}
.say svg{width:86px;height:86px}
.bubble{position:relative;border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-size:18px;font-weight:800;background:var(--card)}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.wzBody{display:flex;flex-direction:column;gap:12px}
.wzBar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.wzBar .in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.countries{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctry{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:10px 10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 4px 0 var(--line)}
.ctry svg{width:100%;height:auto;border-radius:12px;display:block}
.ctry b{font-size:19px;font-weight:900}
.ctry.on{border-color:var(--sel-b);background:var(--sel);box-shadow:0 4px 0 var(--sel-b)}
.ctry.on b{color:var(--blue)}
.cityGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cityOpt{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--line);text-align:left;position:relative}
.cityOpt svg{width:100%;height:auto;border-radius:10px;display:block}
.cityOpt b{font-size:16px;padding:0 4px 2px}
.cityOpt.on{border-color:var(--sel-b);background:var(--sel);box-shadow:0 4px 0 var(--sel-b)} .cityOpt.on b{color:var(--blue)}
.cityOpt.on::after{content:"✓";position:absolute;right:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:9px 13px;font-weight:800;font-size:15.5px;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 var(--line)}
.chip.on{background:var(--sel);border-color:var(--sel-b);color:var(--blue);box-shadow:0 3px 0 var(--sel-b)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;cursor:pointer;display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;text-align:left;box-shadow:0 4px 0 var(--line)}
.opt .e{font-size:30px;text-align:center}
.opt small{display:block;color:var(--sub);font-weight:700;font-size:14px}
.opt.on{border-color:var(--sel-b);background:var(--sel);box-shadow:0 4px 0 var(--sel-b)} .opt.on b{color:var(--blue)}
.who{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:2px solid var(--line)}
.who:first-child{border-top:0}
.who small{display:block;color:var(--sub);font-size:13.5px;font-weight:700}
.emo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--soft)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--line);color:var(--blue)}
.step button:disabled{color:var(--line);cursor:default}
.step b{min-width:22px;text-align:center;font-size:20px;font-weight:900}
.kid{display:grid;grid-template-columns:48px 1fr 118px 30px;gap:10px;align-items:center;padding:10px 0;border-top:2px solid var(--line)}
.kid small{display:block;color:var(--sub);font-size:13px;font-weight:700}
.kid .x{border:0;background:none;height:38px;font-size:22px;cursor:pointer;color:var(--sub);padding:0}
.addkid{border:2px dashed var(--line);background:none;border-radius:16px;padding:13px;font-weight:900;cursor:pointer;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.nights{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#fff4c2;color:#5c4400}
.nights b{font-size:26px;font-weight:900}
/* gerando */
.gen{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center}
.gen h1{font-size:28px}
.gen .mascot{width:160px;height:160px}
.gen .prog{width:100%}
.genl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.genl li{display:flex;gap:10px;align-items:center;color:var(--sub)}
.genl li i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-style:normal;font-size:14px;color:#fff}
.genl li.ok{color:var(--ink)} .genl li.ok i{background:var(--green);border-color:var(--green)} .genl li.ok i::after{content:"✓"}
/* app da viagem */
.band{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-left,0px)) 18px;background:var(--sun);color:#3c2a00;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.band .pillbtn{background:rgba(255,255,255,.6);border-color:transparent;box-shadow:none;color:#3c2a00;position:relative}
.band h1{font-size:clamp(28px,8.5vw,40px);line-height:1.05;margin-top:12px;position:relative;max-width:calc(100% - 84px)}
.band .k{color:#6b5000;position:relative}
.band .bm{position:absolute;right:6px;top:52px;width:84px;height:84px}
.iata{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:14px;padding-bottom:4px;position:relative}
.iata::-webkit-scrollbar{display:none}
.iata .c{background:#fff;color:#3c3c3c;border-radius:12px;padding:5px 9px;font-weight:900;font-size:15px;flex:0 0 auto;box-shadow:0 3px 0 var(--sun-d)}
.iata .ln{flex:0 0 auto;font-size:14px;color:#6b5000}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.kpi{padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.kpi .ic{font-size:24px}
.kpi b{font-size:26px;font-weight:900;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--sub);font-weight:800;text-transform:uppercase}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.sec > h2{font-size:23px}
.next{width:100%;text-align:left;padding:14px 16px;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-transform:none;letter-spacing:0;margin-top:14px}
.next .ic{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:28px}
.next small{display:block;font-size:12.5px;font-weight:900;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
.next b{font-size:19px;font-weight:900}
.warn{list-style:none;margin:0;padding:4px 14px}
.warn li{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:10px 0;border-top:2px solid var(--line);font-size:15px}
.warn li:first-child{border-top:0}
details.more summary{cursor:pointer;color:var(--blue);font-weight:900;text-transform:uppercase;font-size:14px;letter-spacing:.05em;padding:10px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.posts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.post{border-radius:20px;overflow:hidden;color:#fff;display:flex;flex-direction:column;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.post svg{width:100%;height:auto;display:block}
.post .pt{padding:8px 12px 12px}
.post b{font-size:19px;font-weight:900;display:block;line-height:1.1}
.post span{font-size:13.5px;font-weight:800;opacity:.95}
/* caminho do roteiro */
.unit{border-radius:18px;padding:14px 16px;color:#fff;display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2);margin-top:16px}
.unit small{display:block;font-size:12.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;opacity:.9}
.unit b{font-size:22px;font-weight:900;display:block;line-height:1.1}
.unit svg{width:84px;height:auto;border-radius:10px}
.path{display:flex;flex-direction:column;align-items:center;gap:40px;padding:52px 0 34px}
.node{position:relative;width:76px;height:70px;border:0;border-radius:50%;background:var(--nc);box-shadow:0 7px 0 var(--nd);cursor:pointer;font-size:30px;display:grid;place-items:center;color:#fff;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--nd)}
.node.done{--nc:var(--sun);--nd:var(--sun-d)}
.node.done::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--green);border:3px solid var(--bg);font-size:13px;display:grid;place-items:center}
.node .lb{position:absolute;top:100%;margin-top:11px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:var(--sub);white-space:nowrap;text-transform:uppercase}
.node.today{outline:5px solid color-mix(in srgb,var(--nc) 30%,transparent);outline-offset:4px}
.flag{position:absolute;bottom:100%;margin-bottom:14px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--nc);border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-size:13px;font-weight:900;white-space:nowrap;text-transform:uppercase}
.flag::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-5px) rotate(45deg)}
/* detalhe do dia */
.dtop{display:flex;align-items:center;gap:10px;padding-top:14px}
.dtop .x{border:0;background:none;font-size:26px;color:var(--sub);cursor:pointer;padding:0;line-height:1}
.dayart{border-radius:20px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.dayart svg{width:100%;height:auto;display:block}
.dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dh h3{font-size:25px;line-height:1.1}
.tag{font-size:12.5px;font-weight:900;padding:5px 10px;border-radius:10px;white-space:nowrap;background:#d7ffb8;color:#3c8d00;text-transform:uppercase}
.tag.mv{background:#ffe7c2;color:#b35f00} .tag.bt{background:#f3dcff;color:#9a3fd1}
.wx{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:var(--soft);border:2px solid var(--line)}
.wx .ic{font-size:32px}
.wx .t{font-size:26px;font-weight:900}
.live{font-size:11.5px;font-weight:900;color:#fff;background:var(--green);padding:3px 8px;border-radius:8px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.tl .h{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--soft);border:2px solid var(--line)}
.tl .tx small{display:block;font-size:12px;font-weight:900;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.tl .tx{font-size:15.5px}
.tip{padding:12px 14px;border-radius:16px;background:#fff4c2;color:#5c4400;font-size:15px;display:grid;grid-template-columns:28px 1fr;gap:6px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:9px 0}
.steps li i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:900;background:var(--purple);color:#fff;box-shadow:0 3px 0 var(--purple-d)}
.big{font-size:40px;font-weight:900;line-height:1}
.bars{display:flex;flex-direction:column;gap:12px}
.bar2{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;font-size:15px;align-items:center}
.bar2 .tr{grid-column:1/-1;height:14px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.bar2 .tr i{position:absolute;inset:0 auto 0 0;border-radius:9px}
.bar2 .tr i.s{background:var(--green)} .bar2 .tr i.o{background:var(--red)}
.bar2 .tr i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.exp{display:grid;grid-template-columns:40px 1fr auto;gap:2px 10px;padding:11px 0;border-top:2px solid var(--line);align-items:center}
.exp:first-child{border-top:0}
.exp .e{font-size:24px}
.exp .del{grid-column:3;justify-self:end;border:0;background:none;color:var(--red);font-size:12.5px;font-weight:900;cursor:pointer;text-transform:uppercase}
.settle{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:2px solid var(--line)}
.settle:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:16px;flex:0 0 auto;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.pay{font-weight:900;color:var(--green);font-size:17px}
.chk{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:2px solid var(--line);cursor:pointer}
.chk:first-child{border-top:0}
.chk input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:0 0 auto;margin:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.chk input:checked{background:var(--green);border-color:var(--green);box-shadow:0 2px 0 var(--green-d)}
.chk input:checked::after{content:"✓";color:#fff;font-weight:900;font-size:16px}
.chk input:checked + span{text-decoration:line-through;color:var(--sub)}
.party{border-radius:20px;padding:16px;background:var(--green);color:#fff;display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;box-shadow:0 4px 0 var(--green-d)}
.party svg{width:70px;height:70px}
.party b{font-size:20px}
.place{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:2px solid var(--line);align-items:center}
.place:first-of-type{border-top:0}
.place span{grid-column:1}
.place a{grid-column:2;grid-row:1/3;font-size:20px;width:42px;height:42px;border-radius:12px;background:var(--sel);border:2px solid var(--sel-b);display:grid;place-items:center}
.msgs{display:flex;flex-direction:column;gap:10px}
.msgrow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:end}
.msgrow svg{width:44px;height:44px}
.msgrow .msg{max-width:100%}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.b{background:var(--card);border:2px solid var(--line);border-bottom-left-radius:6px;justify-self:start}
.msg.m{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px;box-shadow:0 3px 0 var(--blue-d)}
.cbar{display:flex;gap:8px} .cbar button{padding:0 16px;font-size:14px}
.sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px} .sugg::-webkit-scrollbar{display:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:2px solid transparent;background:none;border-radius:14px;padding:6px 0 4px;font-size:11px;font-weight:900;cursor:pointer;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;text-transform:uppercase;letter-spacing:.03em}
nav.tabs .ti{font-size:25px;line-height:1.1;filter:grayscale(1);opacity:.5}
nav.tabs button.on{color:var(--blue);background:var(--sel);border-color:var(--sel-b)}
nav.tabs button.on .ti{filter:none;opacity:1}
@media (prefers-reduced-motion:no-preference){
  .v > *{animation:pop .35s cubic-bezier(.3,1.4,.5,1) both} .v > *:nth-child(2){animation-delay:.03s} .v > *:nth-child(3){animation-delay:.06s} .v > *:nth-child(n+4){animation-delay:.09s}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .bob{animation:bob 1.8s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-8px)}}
  .rays{animation:spin 14s linear infinite;transform-origin:60px 60px} @keyframes spin{to{transform:rotate(360deg)}}
  .flag{animation:flag 1.4s ease-in-out infinite} @keyframes flag{50%{transform:translate(-50%,-5px)}}
}
@media (max-width:370px){ .g2{grid-template-columns:1fr} .kid{grid-template-columns:40px 1fr 104px 26px;gap:8px} .who{grid-template-columns:40px 1fr auto;gap:10px} .emo{width:40px;height:40px} }

function generate(F){
  const origem=ORIGENS.find(o=>o[0]===F.origem)||ORIGENS[0];

  const T=buildTrip(f); T.orig=origem[1]; T.gastos=[]; T.checks={};
  T.viajantes.forEach((v,i)=>{v.rot=v.nome; v.cor=AVC[i%AVC.length];});
  T.mala.por_pessoa.forEach((p,i)=>p.vi=i);
  return T;
}

function settle(){
  const T=S.trip; const bal={}; people().forEach(p=>bal[p.i]=0);
  T.gastos.forEach(g=>{ const v=toEUR(g); if(!g.entre.length) return; bal[g.pagou]=(bal[g.pagou]||0)+v; const s=v/g.entre.length; g.entre.forEach(i=>bal[i]=(bal[i]||0)-s); });
  const deb=[],cre=[]; Object.entries(bal).forEach(([i,v])=>{ if(v<-0.005) deb.push([+i,-v]); else if(v>0.005) cre.push([+i,v]); });
  deb.sort((a,b)=>b[1]-a[1]); cre.sort((a,b)=>b[1]-a[1]); const out=[];
  let a=0,b=0; while(a<deb.length&&b<cre.length){ const x=Math.min(deb[a][1],cre[b][1]); out.push([deb[a][0],cre[b][0],x]); deb[a][1]-=x; cre[b][1]-=x; if(deb[a][1]<0.005)a++; if(cre[b][1]<0.005)b++; }
  return {bal,out};
}

      if(w&&w.at&&Date.now()-w.at<3*36e5) continue;
      try{ const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=16&timezone=auto`);
        if(r.ok){ const j=await r.json(); const d={}; (j.daily.time||[]).forEach((x,i)=>d[x]={max:j.daily.temperature_2m_max[i],min:j.daily.temperature_2m_min[i],chance:j.daily.precipitation_probability_max[i]??0}); S.wx[id]={at:Date.now(),d}; changed=true; } }catch(e){}
    }
  }
  if(changed){ save(); if(S.view==="trip"&&S.tab!=="custos"&&S.tab!=="guia") render(); }
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled) return; const D=b.dataset, F=S.form;
  if("themeT" in D){ S.theme=S.theme==="auto"?"dark":S.theme==="dark"?"light":"auto"; save(); render(); return; }
  if("start" in D){ S.view="wz"; S.wz=0; render(); window.scrollTo(0,0); return; }
  if("example" in D){ startGen(generate(exampleForm())); return; }
  if("wzback" in D){ if(S.wz>0){S.wz--;} else S.view="home"; render(); window.scrollTo(0,0); return; }
  if("wznext" in D){ if(S.wz===1){ const sug=suggestCities(F.paises,nightsF(F)); const av=citiesFor(F.paises); F.cidades=F.cidades.filter(c=>av.includes(c)); if(!F.cidades.length) F.cidades=sug; }
    if(S.wz<WZ.length-1){ S.wz++; save(); render(); window.scrollTo(0,0); } else { save(); startGen(generate(F)); } return; }
  if(D.ctry){ F.paises=F.paises.includes(D.ctry)?F.paises.filter(x=>x!==D.ctry):[...F.paises,D.ctry]; F.cidades=[]; save(); render(); return; }
  if(D.city){ F.cidades=F.cidades.includes(D.city)?F.cidades.filter(x=>x!==D.city):[...F.cidades,D.city]; save(); render(); return; }
  if(D.inc){ F[D.inc]=Math.min(9,F[D.inc]+1); save(); render(); return; }
  if(D.dec){ F[D.dec]=Math.max(0,F[D.dec]-1); save(); render(); return; }
  if("addkid" in D){ if(F.idades.length<8) F.idades.push(8); save(); render(); return; }
  if(D.rmkid){ F.idades.splice(+D.rmkid,1); save(); render(); return; }
  if(D.pet){ F.pet=D.pet==="1"; save(); render(); if(F.pet) document.querySelector('[data-f="petNome"]')?.focus(); return; }
  if(D.ritmo){ F.ritmo=D.ritmo; save(); render(); return; }
  if(D.orc){ F.orc=D.orc; save(); render(); return; }
  if(D.inter){ F.inter=F.inter.includes(D.inter)?F.inter.filter(x=>x!==D.inter):[...F.inter,D.inter]; save(); render(); return; }
  if(D.open){ openTrip(+D.open); return; }
  if("home" in D){ S.view="home"; S.trip=null; S.cur=null; GF=null; render(); window.scrollTo(0,0); return; }
  if(D.tab){ S.tab=D.tab; S.dayOpen=false; GF=null; render(); window.scrollTo({top:0}); return; }
  if(D.goday){ S.day=+D.goday; S.tab="roteiro"; S.dayOpen=true; render(); window.scrollTo({top:0}); return; }
  if(D.openday){ S.day=+D.openday; S.dayOpen=true; render(); window.scrollTo({top:0}); return; }
  if("closeday" in D){ S.dayOpen=false; render(); const nd=document.querySelector(`[data-openday="${S.day}"]`); nd&&nd.scrollIntoView({block:"center"}); return; }
  if(D.day!=null){ S.day=+D.day; render(); window.scrollTo({top:0}); return; }
  if(D.entre!=null){ const i=+D.entre; keepForm(); GF.entre=GF.entre.includes(i)?GF.entre.filter(x=>x!==i):[...GF.entre,i]; render(); return; }
  if(D.delg){ S.trip.gastos=S.trip.gastos.filter(g=>g.id!==D.delg); persistTrip(); render(); return; }
  if(D.ask){ ask(D.ask); return; }
});
function keepForm(){ const f=document.querySelector("form[data-addg]"); if(!f) return; GF.desc=f.desc.value; GF.valor=f.valor.value; GF.moeda=f.moeda.value; GF.cat=f.cat.value; GF.pagou=+f.pagou.value; }
function refreshNext(){ const b=document.querySelector("[data-wznext]"); if(b) b.disabled=!WZ[S.wz].ok(S.form); }
document.addEventListener("change",e=>{
  const t=e.target, D=t.dataset, F=S.form;
  if(D.f){ F[D.f]=t.value; if(D.f==="ida"&&F.volta&&F.volta<=F.ida) F.volta=""; save(); if(D.f!=="petNome") render(); else refreshNext(); return; }
  if(D.age!=null){ F.idades[+D.age]=+t.value; save(); render(); return; }
  if(D.vname!=null){ const v=t.value.trim(); S.trip.viajantes[+D.vname].nome=v||S.trip.viajantes[+D.vname].rot; persistTrip(); render(); return; }
  if(D.ck){ S.trip.checks[D.ck]=t.checked; persistTrip(); const total=S.trip.mala.todos.length+S.trip.mala.por_pessoa.reduce((a,p)=>a+p.itens.length,0); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
});
document.addEventListener("input",e=>{ if(e.target.dataset.f==="petNome"){ S.form.petNome=e.target.value; save(); refreshNext(); } });
document.addEventListener("submit",e=>{
  const f=e.target; e.preventDefault();
  if("addg" in f.dataset){ keepForm(); const v=parseFloat(String(GF.valor).replace(",","."));
    if(!GF.desc.trim()||!(v>0)||!GF.entre.length){ alertIn(f,"Falta o que foi, o valor ou com quem dividir."); return; }
    S.trip.gastos.push({id:"g"+Date.now(),desc:GF.desc.trim(),valor:v,moeda:GF.moeda,cat:GF.cat,pagou:GF.pagou,entre:GF.entre.slice()});
    GF.desc="";GF.valor=""; persistTrip(); render(); return; }
  if("chat" in f.dataset){ const q=f.q.value.trim(); if(q) ask(q); }
});
function alertIn(f,msg){ let el=f.querySelector(".err"); if(!el){el=document.createElement("div");el.className="err";el.setAttribute("role","alert");f.insertBefore(el,f.lastElementChild);} el.textContent=msg; }
function ask(q){ S.chat.push({r:"m",t:q}); let a; try{a=localGuide(q);}catch(e){a="Não consegui responder agora. Tente perguntar de outro jeito.";} S.chat.push({r:"b",t:a}); render(); }

load(); if(S.trips.length) S.view="home"; render();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
