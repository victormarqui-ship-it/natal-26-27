<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --glass:rgba(20,27,44,.72); --glass-2:rgba(20,27,44,.5); --glass-brd:rgba(255,255,255,.09);
  --sky-a:#2a1650; --sky-b:#5a2a5e; --sky-c:#10345e; --shadow:0 18px 40px -22px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{

.thead h1{font-size:clamp(36px,10vw,54px);font-weight:800;line-height:1}

function localGuide(q){
  const T=S.trip; const n=q.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const has=(...w)=>w.some(x=>n.includes(x));
  const m=n.match(/\bdia\s*(\d{1,2})\b/);
  if (m){ const dd=T.dias.find(x=>pd(x.data).getUTCDate()===+m[1]); if(dd) return `${wd(dd.data)}, ${fmtD(dd.data)} — ${dd.titulo} (${dd.cidade}):\n`+dd.itens.map(([h,t])=>`• ${h}: ${t}`).join("\n"); }
  const cityHit=T.cidades.find(c=>n.includes(c.nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")));
  if (has("trem","voo","como ir","como chego","deslocamento","transporte")){ const mv=T.dias.filter(x=>x.tipo==="deslocamento"&&x.passos); return mv.map(x=>`${fmtD(x.data)} — ${x.titulo}:\n`+x.passos.map(([h,t])=>`• ${h}: ${t}`).join("\n")).join("\n\n"); }
  if (has("mala","levar","roupa")) return "Para todos: "+T.mala.todos.join("; ")+".\n\nA lista de cada pessoa está na aba Mala.";
  if (has("documento","passaporte","seguro","visto","etias","autorizacao")) return T.avisos.join("\n");
  if (has("quanto","custa","orcamento","gasto","preco")){ const tot=T.orcamento.itens.reduce((a,i)=>a+i[1],0); return `Estimativa total: cerca de ${tot.toLocaleString("pt-BR")} euros, fora as passagens do Brasil.\n`+T.orcamento.itens.map(([c,v])=>`• ${c}: ${v.toLocaleString("pt-BR")} €`).join("\n"); }
  if (has("comer","comida","prato","restaurante")) return T.guia.map(g=>`${g.cidade}: ${g.comer.join(", ")}`).join("\n");
  if (cityHit){ const g=T.guia.find(x=>x.cidade===cityHit.nome); return `${cityHit.nome} (${cityHit.noites} noites). Não percam: `+g.ver.slice(0,4).map(v=>v[0]).join("; ")+".\nPara provar: "+g.comer.join(", ")+"."; }
  if (has("crianca","bebe","filho")) return "Com crianças: o roteiro prioriza passeios tranquilos e para a idade delas, como "+T.guia.flatMap(g=>g.ver.slice(0,1).map(v=>v[0])).join(", ")+". Veja na aba Mala os itens de cada criança e, em Início, os documentos para menores.";
  return "Posso ajudar com: o programa de um dia (ex.: 'o que fazemos no dia 12?'), trens e voos, mala, documentos, orçamento, comidas ou uma cidade específica.";
}

function validate(F){
  if(!F.paises.length) return "Escolha Portugal, Itália ou os dois.";
  if(!F.ida||!F.volta) return "Preencha a data de saída do Brasil e a do voo de volta.";
  const N=nightsBetween(F.ida,F.volta);
  if(N<4) return "A viagem precisa ter pelo menos 4 dias entre a saída e a volta.";
  if(N>35) return "Por enquanto o Sunny Trip monta viagens de até 35 dias.";

function settle(){
  const T=S.trip; const bal={}; people().forEach(p=>bal[p.i]=0);
  T.gastos.forEach(g=>{ const v=toEUR(g); if(!g.entre.length) return; bal[g.pagou]=(bal[g.pagou]||0)+v; const s=v/g.entre.length; g.entre.forEach(i=>bal[i]=(bal[i]||0)-s); });
  const deb=[],cre=[]; Object.entries(bal).forEach(([i,v])=>{ if(v<-0.005) deb.push([+i,-v]); else if(v>0.005) cre.push([+i,v]); });
  deb.sort((a,b)=>b[1]-a[1]); cre.sort((a,b)=>b[1]-a[1]); const out=[];
  let a=0,b=0; while(a<deb.length&&b<cre.length){ const x=Math.min(deb[a][1],cre[b][1]); out.push([deb[a][0],cre[b][0],x]); deb[a][1]-=x; cre[b][1]-=x; if(deb[a][1]<0.005)a++; if(cre[b][1]<0.005)b++; }
  return {bal,out};
}

async function fetchLive(){
  const T=S.trip; if(!T) return; let changed=false;
  try{ if(!S.fx||!S.fx.at||Date.now()-S.fx.at>6*36e5){ const r=await fetch("https://api.frankfurter.app/latest?from=EUR&to=BRL"); if(r.ok){const j=await r.json(); if(j.rates&&j.rates.BRL){S.fx={rate:j.rates.BRL,date:j.date,at:Date.now()};changed=true;}} } }catch(e){}
  const t=todayISO(), lim=addDays(t,15);
  if(T.volta>=t && T.ida<=lim){
    for(const id of T.cityIds){ const c=KB[id]; const w=S.wx[id];
      if(w&&w.at&&Date.now()-w.at<3*36e5) continue;
      try{ const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=16&timezone=auto`);
        if(r.ok){ const j=await r.json(); const d={}; (j.daily.time||[]).forEach((x,i)=>d[x]={max:j.daily.temperature_2m_max[i],min:j.daily.temperature_2m_min[i],chance:j.daily.precipitation_probability_max[i]??0}); S.wx[id]={at:Date.now(),d}; changed=true; } }catch(e){}
    }
  }
  if(changed){ save(); if(S.view==="trip"&&(S.tab==="roteiro"||S.tab==="custos"||S.tab==="inicio")) render(); }
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-tab]"); if(!b) return; const D=b.dataset, F=S.form;
  if("themeT" in D){ S.theme=S.theme==="auto"?"dark":S.theme==="dark"?"light":"auto"; save(); render(); return; }
  if(D.ctry){ F.paises=F.paises.includes(D.ctry)?F.paises.filter(x=>x!==D.ctry):[...F.paises,D.ctry]; F.cidades=F.cidades.filter(c=>citiesFor(F.paises).includes(c)); save(); render(); return; }
  if(D.city){ const N=F.ida&&F.volta?nightsBetween(F.ida,F.volta):0; if(!F.cidades.length) F.cidades=N>0?suggestCities(F.paises,N):[]; F.cidades=F.cidades.includes(D.city)?F.cidades.filter(x=>x!==D.city):[...F.cidades,D.city]; save(); render(); return; }
  if("clearc" in D){ F.cidades=[]; save(); render(); return; }
  if(D.inc){ F[D.inc]=Math.min(9,F[D.inc]+1); save(); render(); return; }
  if(D.dec){ F[D.dec]=Math.max(0,F[D.dec]-1); save(); render(); return; }
  if("addkid" in D){ if(F.idades.length<8) F.idades.push(8); save(); render(); return; }
  if(D.rmkid){ F.idades.splice(+D.rmkid,1); save(); render(); return; }
  if(D.ritmo){ F.ritmo=D.ritmo; save(); render(); return; }
  if(D.orc){ F.orc=D.orc; save(); render(); return; }
  if(D.inter){ F.inter=F.inter.includes(D.inter)?F.inter.filter(x=>x!==D.inter):[...F.inter,D.inter]; save(); render(); return; }
  if("go" in D){ S.err=validate(F); if(S.err){ render(); document.querySelector(".err")?.scrollIntoView({block:"center",behavior:"smooth"}); return; } save(); startGen(generate(F)); return; }
  if("example" in D){ S.err=""; startGen(generate(exampleForm())); return; }
  if(D.open){ openTrip(+D.open); window.scrollTo(0,0); return; }
  if("home" in D){ S.view="form"; S.trip=null; S.cur=null; GF=null; render(); window.scrollTo(0,0); return; }
  if(D.tab){ S.tab=D.tab; GF=null; render(); window.scrollTo({top:0}); return; }
  if(D.goday){ S.day=+D.goday; S.tab="roteiro"; render(); window.scrollTo({top:0}); return; }
  if(D.day!=null){ S.day=+D.day; render(); return; }
  if(D.entre!=null){ const i=+D.entre; GF.entre=GF.entre.includes(i)?GF.entre.filter(x=>x!==i):[...GF.entre,i]; keepForm(); render(); return; }
  if(D.delg){ S.trip.gastos=S.trip.gastos.filter(g=>g.id!==D.delg); persistTrip(); render(); return; }
  if(D.ask){ ask(D.ask); return; }
});
function keepForm(){ const f=document.querySelector("form[data-addg]"); if(!f) return; GF.desc=f.desc.value; GF.valor=f.valor.value; GF.moeda=f.moeda.value; GF.cat=f.cat.value; GF.pagou=+f.pagou.value; }
document.addEventListener("change",e=>{
  const t=e.target, D=t.dataset, F=S.form;
  if(D.f){ F[D.f]=t.value; if(D.f==="ida"&&F.volta&&F.volta<=F.ida) F.volta=""; save(); if(D.f!=="petNome") render(); return; }
  if(D.age!=null){ F.idades[+D.age]=+t.value; save(); render(); return; }
  if("pet" in D){ F.pet=t.checked; save(); render(); return; }
  if(D.vname!=null){ const v=t.value.trim(); S.trip.viajantes[+D.vname].nome=v||S.trip.viajantes[+D.vname].rot; persistTrip(); render(); return; }
  if(D.ck){ S.trip.checks[D.ck]=t.checked; persistTrip(); return; }
});
document.addEventListener("input",e=>{ if(e.target.dataset.f==="petNome"){ S.form.petNome=e.target.value; save(); } });
document.addEventListener("submit",e=>{
  const f=e.target; e.preventDefault();
  if("addg" in f.dataset){ keepForm(); const v=parseFloat(String(GF.valor).replace(",","."));
    if(!GF.desc.trim()||!(v>0)||!GF.entre.length){ alertIn(f,"Preencha o que foi, o valor e escolha com quem dividir."); return; }
    S.trip.gastos.push({id:"g"+Date.now(),desc:GF.desc.trim(),valor:v,moeda:GF.moeda,cat:GF.cat,pagou:GF.pagou,entre:GF.entre.slice()});
    GF.desc="";GF.valor=""; persistTrip(); render(); return; }
  if("chat" in f.dataset){ const q=f.q.value.trim(); if(q) ask(q); }
});
function alertIn(f,msg){ let el=f.querySelector(".err"); if(!el){el=document.createElement("div");el.className="err";el.setAttribute("role","alert");f.insertBefore(el,f.lastElementChild);} el.textContent=msg; }
function ask(q){ S.chat.push({r:"m",t:q}); let a; try{a=localGuide(q);}catch(e){a="Não consegui responder agora. Tente perguntar de outro jeito.";} S.chat.push({r:"b",t:a}); render(); document.querySelector(".cbar input")?.focus(); }

load(); render();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
