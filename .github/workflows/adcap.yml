name: ad-capture
on:
  push:
    branches: [ad-capture]
    paths: [adcap/cap.js, .github/workflows/adcap.yml]
permissions:
  contents: write
jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji fonts-noto-core
      - run: npm i playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: mkdir -p adcap/shots && node adcap/cap.js
      - run: |
          git config user.name "sunny-bot"; git config user.email "bot@users.noreply.github.com"
          git add adcap/shots && git commit -m "ad shots [skip ci]" && git push
